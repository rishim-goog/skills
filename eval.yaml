      - type: llm_rubric
        weight: 0.55
        outcome_assertions:
          - The agent must export the SPDX SBOM for the built image using gcloud artifacts sbom export.
          - The agent must evaluate the image digest against the Binary Authorization policy using gcloud beta container binauthz policy evaluate.
          - When the policy evaluation is CONFORMANT, the agent must sign and create the prod-attestor attestation and deploy to Cloud Run prod with --binary-authorization=default.

  # Prompt #4 - Scenario 4.2: Blocked prod Promotion — Vulnerable Image or Missing SLSA Provenance
  - name: prompt4-scenario4-2-prod-promotion-blocked-binauthz
    instruction: |
      Promote and deploy this application to the prod Cloud Run environment. Yes, I confirm deploying to prod. If Binary Authorization blocks the prod deployment or the policy evaluation is NON_CONFORMANT, diagnose and explain the exact policy check and CVEs/provenance issues that caused the block.

    timeout: 600

    trialConfig:
      setup: |
        scripts/setup_gcloud.sh
        git clone -b no-dockerfile https://github.com/sdlc-graph/chefs-companion.git /workspace/chefs-companion-prod-blocked
        cat <<'EOF' > /workspace/chefs-companion-prod-blocked/Dockerfile
        FROM python:3.8-slim-buster
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -r requirements.txt || true
        EXPOSE 8080
        CMD ["python", "app.py"]
        EOF
        mkdir -p /workspace/chefs-companion-prod-blocked/.gcp-deploy
        cat <<EOF > /workspace/chefs-companion-prod-blocked/.gcp-deploy/deployment-config.json
        {
          "active_runtime": "Cloud Run",
          "default_environment": "dev",
          "fail_on_push_error": true,
          "common_gcp_settings": {
            "project_id": "${PROJECT_ID}",
            "region": "${REGION}"
          },
          "cloud_run": {
            "prod": {
              "project_id": "${PROJECT_ID}",
              "region": "${REGION}",
              "artifact_registry": "${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY}",
              "service_name": "app-p4s2-${_EVAL_UUID}-${_EVAL_TRIAL}",
              "public_access": false,
