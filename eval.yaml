  # ============================================================================
  # ADDITIONAL SKILL CAPABILITY EVAL: Cloud Run Prod Binary Authorization Gate
  # & Failure Interpretation (Covers commits f354bd0, f96a0bb, 34c3447)
  # ============================================================================
  - name: deploy-cloud-run-prod-binauthz-gate
    instruction: |
      Deploy this application to the prod Cloud Run environment. Yes, I confirm deploying to prod. If Binary Authorization blocks the prod deployment or the policy evaluation is NON_CONFORMANT, diagnose and explain the exact policy check and CVEs/provenance issues that caused the block.

    timeout: 600

    trialConfig:
      setup: |
        git clone -b no-dockerfile https://github.com/sdlc-graph/chefs-companion.git /workspace/chefs-companion-prod
        mkdir -p /workspace/chefs-companion-prod/.gcp-deploy
        cat <<EOF > /workspace/chefs-companion-prod/.gcp-deploy/deployment-config.json
        {
          "active_runtime": "Cloud Run",
          "default_environment": "dev",
          "fail_on_push_error": true,
          "common_gcp_settings": {
            "project_id": "${PROJECT_ID}",
            "region": "${REGION}"
          },
          "cloud_run": {
            "prod": {
              "project_id": "${PROJECT_ID}",
              "region": "${REGION}",
              "artifact_registry": "${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY}",
              "service_name": "app-prod-${_EVAL_UUID}-${_EVAL_TRIAL}",
              "public_access": false,
              "container_port": 8080,
              "binary_authorization": "default",
              "binary_authorization_policy": "prod-policy",
              "require_confirmation": true
            }
          }
        }
        EOF
      cleanup: scripts/teardown-cloud-run.sh app-prod-${_EVAL_UUID}-${_EVAL_TRIAL}

    agentWorkingDir: /workspace/chefs-companion-prod

    graders:
      - type: tool_usage
        weight: 0.30
        expectedTools:
          - name: activate_skill
            args:
              name: google-cicd-deploy
          - name: run_shell_command
      - type: llm_rubric
        weight: 0.70
        outcome_assertions:
          - The agent must export the SPDX SBOM for the built image using gcloud artifacts sbom export.
          - The agent must evaluate the image digest against the Binary Authorization policy using gcloud beta container binauthz policy evaluate.
          - When deploying to Cloud Run prod, the agent must pass --binary-authorization=default.
          - If the policy evaluation returns NON_CONFORMANT or Binary Authorization blocks deployment, the agent must inspect provenance and vulnerability scan results (gcloud artifacts docker images describe --show-provenance --show-package-vulnerability) and explain which check (SlsaCheck or VulnerabilityCheck CVEs) failed.
