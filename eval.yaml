      cleanup: scripts/teardown-cloud-run.sh app-p4s2-${_EVAL_UUID}-${_EVAL_TRIAL}

    agentWorkingDir: /workspace/chefs-companion-prod-blocked

    graders:
      - type: llm_rubric
        weight: 1.0
        outcome_assertions:
          - The agent must evaluate the image digest against the Binary Authorization policy using gcloud beta container binauthz policy evaluate.
          - When the policy evaluation returns NON_CONFORMANT, the agent must NOT sign the prod-attestor attestation.
          - The agent must inspect provenance and package vulnerability findings using gcloud artifacts docker images describe --show-provenance --show-package-vulnerability.
          - The agent must clearly explain which check failed (SlsaCheck and/or VulnerabilityCheck HIGH/CRITICAL CVEs) and provide actionable remediation steps.

  # ============================================================================
  # PROMPT #5: "Design and configure a multi-environment release pipeline
  #             (staging -> prod) with canary deployment and automated rollback
  #             on Cloud Monitoring alerts"
  # ============================================================================
  - name: prompt5-release-orchestration-canary-observability
    instruction: |
      Design and configure a multi-environment Cloud Deploy release pipeline (staging -> prod) targeting Cloud Run with a canary deployment strategy (25% and 75%) on prod, automatic rollback on rollout failure, and Google Cloud Observability alert policy analysis on the pipeline.

    workspace:
      - content: |
          1. The project id is available as $PROJECT_ID.
          2. The region is available as $REGION.
          3. The application name is chefs-companion.
          4. Define the delivery pipeline, staging target (chefs-companion-staging -> Cloud Run service-staging), prod target (chefs-companion-prod -> Cloud Run service-prod), canary strategy (25 and 75 on prod), and automation rules in clouddeploy.yaml.
          5. Configure alert policy analysis in clouddeploy.yaml and generate basic Cloud Run manifests and skaffold.yaml with matching profiles.
          6. Validating the generated configuration files is sufficient; do not apply to GCP.
        dest: /workspace/GEMINI.md

    timeout: 600

    trialConfig:
      setup: |
        scripts/setup_gcloud.sh
        git clone -b no-cloudbuild https://github.com/sdlc-graph/chefs-companion.git /workspace/chefs-companion-p5
        cp /workspace/GEMINI.md /workspace/chefs-companion-p5/GEMINI.md
        cp /workspace/GEMINI.md /workspace/chefs-companion-p5/CLAUDE.md
        cp /workspace/GEMINI.md /workspace/chefs-companion-p5/AGENTS.md

    agentWorkingDir: /workspace/chefs-companion-p5

    graders:
      - type: deterministic
        weight: 0.35
        run: python3 /workspace/scripts/validate-clouddeploy.py --runtime=run --check-canary --check-automations /workspace/chefs-companion-p5
      - type: deterministic
        weight: 0.25
        run: python3 /workspace/scripts/validate-skaffold.py --profiles=chefs-companion-staging,chefs-companion-prod /workspace/chefs-companion-p5
      - type: deterministic
        weight: 0.20
        run: python3 /workspace/scripts/validate-manifests-cloudrun.py --services=service-staging,service-prod /workspace/chefs-companion-p5
      - type: llm_rubric
        weight: 0.20
        outcome_assertions:
          - A clouddeploy.yaml file must be created with staging and prod targets prefixed with the application name (chefs-companion-staging, chefs-companion-prod).
          - A canary strategy with 25 and 75 phases must be configured on the prod stage.
          - An Automation resource with repairRolloutJob rollback must be defined in clouddeploy.yaml.
          - Observability alert policy analysis (customChecks or alertPolicies) must be configured or generated for the pipeline.

  # ============================================================================
  # AUTHENTICATION, PERMISSION & PUSH-FAILURE ERROR SUITE
  # ============================================================================

  # Error Case 1: Expired / Invalid GCP Credentials (401 UNAUTHENTICATED)
  - name: error-gcp-unauthenticated-token
    instruction: |
      Build and deploy this application to my GCP development environment.

    timeout: 300

    trialConfig:
      setup: |
        scripts/setup_gcloud.sh
        git clone -b buildpacks https://github.com/sdlc-graph/chefs-companion.git /workspace/unauth-gcp-app
        mkdir -p /workspace/unauth-gcp-app/.gcp-deploy
        cat <<EOF > /workspace/unauth-gcp-app/.gcp-deploy/deployment-config.json
        {
          "active_runtime": "Cloud Run",
          "default_environment": "dev",
          "fail_on_push_error": true,
          "common_gcp_settings": {
            "project_id": "${PROJECT_ID}",
            "region": "${REGION}"
          },
          "cloud_run": {
            "dev": {
              "project_id": "${PROJECT_ID}",
              "region": "${REGION}",
              "artifact_registry": "${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY}",
              "service_name": "unauth-gcp-${_EVAL_UUID}-${_EVAL_TRIAL}",
              "public_access": true,
              "container_port": 8080
            }
          }
        }
        EOF
        # Inject an expired/invalid access token so gcloud fails with 401 UNAUTHENTICATED
        echo "ya29.expired-invalid-eval-token" > /tmp/expired_token.txt
        gcloud config set auth/access_token_file /tmp/expired_token.txt

    agentWorkingDir: /workspace/unauth-gcp-app

    graders:
      - type: deterministic
        weight: 0.40
        run: >
          python3 /workspace/scripts/validate-error-handling.py
          --workspace=/workspace/unauth-gcp-app
      - type: llm_rubric
        weight: 0.60
        outcome_assertions:
          - The agent must read .gcp-deploy/deployment-config.json without prompting the user for pre-configured settings.
          - When gcloud returns an authentication error (Invalid authentication credentials / 401 UNAUTHENTICATED), the agent must immediately halt execution.
          - The agent must guide the user to re-authenticate by providing the proper gcloud authentication command (e.g., gcloud auth login or gcloud auth application-default login).

  # Error Case 2: Artifact Registry Push Permission Denied + fail_on_push_error: true Hard-Fail
  - name: error-artifact-registry-push-denied
    instruction: |
      Deploy this application to my GCP development environment.

    timeout: 300

    trialConfig:
      setup: |
        scripts/setup_gcloud.sh
        git clone -b no-dockerfile https://github.com/sdlc-graph/chefs-companion.git /workspace/ar-denied-app
        mkdir -p /workspace/ar-denied-app/.gcp-deploy
        cat <<EOF > /workspace/ar-denied-app/.gcp-deploy/deployment-config.json
        {
          "active_runtime": "Cloud Run",
          "default_environment": "dev",
          "fail_on_push_error": true,
          "common_gcp_settings": {
            "project_id": "${PROJECT_ID}",
            "region": "${REGION}"
          },
          "cloud_run": {
            "dev": {
              "project_id": "${PROJECT_ID}",
              "region": "${REGION}",
              "artifact_registry": "${REGION}-docker.pkg.dev/restricted-unowned-project-000/locked-repo",
              "service_name": "ar-denied-${_EVAL_UUID}-${_EVAL_TRIAL}",
              "public_access": true,
              "container_port": 8080
            }
          }
        }
        EOF

    agentWorkingDir: /workspace/ar-denied-app

    graders:
      - type: deterministic
        weight: 0.50
        run: >
          python3 /workspace/scripts/validate-error-handling.py
          --workspace=/workspace/ar-denied-app
          --project-id="${PROJECT_ID}"
          --region="${REGION}"
          --prohibited-service="ar-denied-${_EVAL_UUID}-${_EVAL_TRIAL}"
      - type: llm_rubric
        weight: 0.50
        outcome_assertions:
          - Because fail_on_push_error is true, when accessing or pushing to the configured Artifact Registry repository fails with PERMISSION_DENIED, the agent must immediately fail and halt the deployment.
          - The agent must NOT bypass Artifact Registry by deploying via buildpacks (--source) or pushing to a different registry.
          - The agent must report the exact permission error and suggest a corrective gcloud IAM command (such as granting roles/artifactregistry.writer).

  # Error Case 3: GKE Cluster Authentication / Access Failure (Scenario #2 Error Case)
  - name: error-gke-cluster-auth-denied
    instruction: |
      Build and deploy this application to my GCP development environment.

    timeout: 300

    trialConfig:
      setup: |
        scripts/setup_gcloud.sh
        git clone -b no-dockerfile https://github.com/sdlc-graph/chefs-companion.git /workspace/gke-denied-app
        mkdir -p /workspace/gke-denied-app/.gcp-deploy
        cat <<EOF > /workspace/gke-denied-app/.gcp-deploy/deployment-config.json
        {
          "active_runtime": "GKE",
          "default_environment": "dev",
          "fail_on_push_error": true,
          "common_gcp_settings": {
            "project_id": "${PROJECT_ID}",
            "region": "${REGION}"
          },
          "gke": {
            "dev": {
              "project_id": "restricted-unowned-gke-project-000",
              "cluster_location": "${REGION}",
              "cluster_name": "unauthorized-gke-cluster",
              "namespace": "dev",
              "artifact_registry": "${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY}",
              "manifest_path": "./kubernetes-manifests/"
            }
          }
        }
        EOF

    agentWorkingDir: /workspace/gke-denied-app

    graders:
      - type: deterministic
        weight: 0.40
        run: >
          python3 /workspace/scripts/validate-error-handling.py
          --workspace=/workspace/gke-denied-app
      - type: llm_rubric
        weight: 0.60
        outcome_assertions:
          - The agent must read .gcp-deploy/deployment-config.json and target GKE without prompting the user for pre-configured settings.
          - When gcloud container clusters get-credentials or cluster access fails with a permission/authentication error, the agent must halt execution and report the error.
          - The agent must suggest the proper corrective gcloud command (e.g., gcloud container clusters get-credentials or granting roles/container.developer).
